name: Build Scorpio B9 OC
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y git make clang lld gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev python3 libncurses-dev
      - name: Clone Source
        run: |
          rm -rf kernel
          git clone https://github.com/DevZillion/android_kernel_samsung_a03s.git --depth=1 kernel
          ls kernel/arch/arm64/configs/ | grep a03
      - name: Fix Kconfig Error
        run: |
          cd kernel
          # Hapus driver touchscreen mediatek yang bikin error '+'
          rm -rf drivers/input/touchscreen/mediatek/hxchipset
          sed -i '/hxchipset/d' drivers/input/touchscreen/mediatek/Kconfig 2>/dev/null || true
          sed -i '/hxchipset/d' drivers/input/touchscreen/Kconfig 2>/dev/null || true
      - name: Build OC
        run: |
          cd kernel
          export ARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=ScorpioB9
          def=$(ls arch/arm64/configs/ | grep a03 | head -n1)
          echo "BUILD $def"
          make $def
          make -j$(nproc) Image dtb.img
          ls -lh arch/arm64/boot/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Scorpio-B9-OC-FIXED
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/*.img
