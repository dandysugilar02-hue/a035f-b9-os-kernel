name: Build Scorpio B9 OC
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y git make clang-14 lld-14 gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev python3 libncurses-dev gcc-arm-linux-gnueabihf
      - name: Clone Source
        run: |
          rm -rf kernel
          git clone https://github.com/DevZillion/android_kernel_samsung_a03s.git --depth=1 kernel
          ls kernel/arch/arm64/configs/ | grep a03
      - name: Fix Source
        run: |
          cd kernel
          rm -rf drivers/input/touchscreen/mediatek/hxchipset
          sed -i '/hxchipset/d' drivers/input/touchscreen/mediatek/Kconfig 2>/dev/null || true
          sed -i '/hxchipset/d' drivers/input/touchscreen/Kconfig 2>/dev/null || true
          mkdir -p toolchain/clang/host/linux-x86/clang-r383902/bin
          ln -sf /usr/bin/clang-14 toolchain/clang/host/linux-x86/clang-r383902/bin/clang
          ln -sf /usr/bin/clang-14 toolchain/clang/host/linux-x86/clang-r383902/bin/clang++
          mkdir -p toolchain/llvm-Snapdragon_LLVM_arm/bin
          ln -sf /usr/bin/clang-14 toolchain/llvm-Snapdragon_LLVM_arm/bin/clang || true
          chmod +x scripts/*.sh 2>/dev/null || true
      - name: Build OC
        run: |
          cd kernel
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export KBUILD_BUILD_USER=ScorpioB9
          export PATH=/usr/lib/llvm-14/bin:$PATH
          def=$(ls arch/arm64/configs/ | grep a03 | head -n1)
          echo "BUILD $def"
          make $def
          make -j$(nproc) Image
          ls -lh arch/arm64/boot/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Scorpio-B9-OC-FIXED
          path: kernel/arch/arm64/boot/Image
