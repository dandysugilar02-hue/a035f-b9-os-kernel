name: Build Scorpio B9 OC
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y git make clang lld gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev
      - name: Clone Source
        run: |
          rm -rf kernel
          git clone https://github.com/DevZillion/android_kernel_samsung_a03s.git --depth=1 kernel
          ls kernel/arch/arm64/configs
      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Dandy
          export KBUILD_BUILD_HOST=ScorpioB9
          make a03s_defconfig || make a035f_defconfig || ls arch/arm64/configs/
          make -j$(nproc) CC=clang CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld 2>&1 | tee build.log
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Image-B9-OC
          path: |
            kernel/arch/arm64/boot/Image*
            kernel/build.log
